server.port=8082
spring.application.name=postcode-io-gateway
external-provider.mode=${EXTERNAL_PROVIDER_MODE:}
external-provider.base-url=${EXTERNAL_PROVIDER_BASE_URL:https://api.postcodes.io}
external-provider.resilience.connect-timeout=${PROVIDER_CONNECT_TIMEOUT:500ms}
external-provider.resilience.response-timeout=${PROVIDER_RESPONSE_TIMEOUT:1s}
external-provider.resilience.total-timeout=${PROVIDER_TOTAL_TIMEOUT:4s}
external-provider.resilience.max-retries=${PROVIDER_MAX_RETRIES:2}
external-provider.resilience.initial-backoff=${PROVIDER_INITIAL_BACKOFF:100ms}
external-provider.resilience.max-backoff=${PROVIDER_MAX_BACKOFF:500ms}
external-provider.resilience.jitter=${PROVIDER_RETRY_JITTER:0.5}
external-provider.resilience.circuit-failure-threshold=${PROVIDER_CIRCUIT_FAILURE_THRESHOLD:5}
external-provider.resilience.circuit-open-duration=${PROVIDER_CIRCUIT_OPEN_DURATION:30s}
external-provider.resilience.success-cache-ttl=${PROVIDER_SUCCESS_CACHE_TTL:15m}
external-provider.resilience.negative-cache-ttl=${PROVIDER_NEGATIVE_CACHE_TTL:1m}
external-provider.resilience.cache-maximum-entries=${PROVIDER_CACHE_MAXIMUM_ENTRIES:1000}
deployment.environment-class=${DEPLOYMENT_ENVIRONMENT_CLASS:}
provider-diagnostics.enabled=${PROVIDER_MODE_ENDPOINT_ENABLED:false}
fixture.system-data-service-url=${SYSTEM_DATA_SERVICE_URL:http://localhost:8103}
fixture.dataset-id=${FIXTURE_DATASET_ID:uk-software-developer-demo}
fixture.dataset-version=${FIXTURE_DATASET_VERSION:1.0.0}
fixture.scenario=${FIXTURE_SCENARIO:happy-path}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=always
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
