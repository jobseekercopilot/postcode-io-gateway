server.port=8082
spring.application.name=postcode-io-gateway
external-provider.mode=${EXTERNAL_PROVIDER_MODE:LIVE}
fixture.system-data-service-url=${SYSTEM_DATA_SERVICE_URL:http://localhost:8103}
fixture.dataset-id=${FIXTURE_DATASET_ID:uk-software-developer-demo}
fixture.dataset-version=${FIXTURE_DATASET_VERSION:1.0.0}
fixture.scenario=${FIXTURE_SCENARIO:happy-path}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
